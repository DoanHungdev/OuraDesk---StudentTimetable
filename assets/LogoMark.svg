<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%" fill="none">
  <defs>
    <!-- Top Bar Gradient -->
    <linearGradient id="odTopGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F16C6C" />
      <stop offset="100%" stop-color="#F59E72" />
    </linearGradient>

    <!-- Bottom Left Gradient -->
    <linearGradient id="odBottomLeftGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E85D75" />
      <stop offset="60%" stop-color="#F16C6C" />
      <stop offset="100%" stop-color="#F59E72" />
    </linearGradient>

    <!-- Right Pillar Gradient -->
    <linearGradient id="odRightGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F59E72" />
      <stop offset="100%" stop-color="#F16C6C" />
    </linearGradient>

    <!-- Page Fold Gradient -->
    <linearGradient id="odFoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFDDD4" />
      <stop offset="50%" stop-color="#FFBBAA" />
      <stop offset="100%" stop-color="#FFA085" />
    </linearGradient>

    <!-- Fold Crease Shadow -->
    <filter id="odFoldShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="-1" dy="-1" stdDeviation="1.5" flood-color="#7A2210" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- 1. Top Section (Rounded Top-Left & Top-Right) -->
  <path d="M 12 10 
           L 88 10 
           A 14 14 0 0 1 100 24 
           L 100 38 
           L 62 38 
           L 62 44 
           L 10 44 
           L 10 24 
           A 14 14 0 0 1 24 10 Z" 
        fill="url(#odTopGrad)" />

  <!-- 2. Bottom-Left Section (Rounded Bottom-Left & Chamfered Top-Right) -->
  <path d="M 10 50 
           L 26 50 
           L 48 72 
           L 48 90 
           L 24 90 
           A 14 14 0 0 1 10 76 Z" 
        fill="url(#odBottomLeftGrad)" />

  <!-- 3. Right Vertical Pillar / Stem -->
  <path d="M 54 44 
           L 100 44 
           L 100 68 
           L 76 90 
           L 54 90 Z" 
        fill="url(#odRightGrad)" />

  <!-- 4. Folded Corner (Page / Desk Peel Effect) -->
  <path d="M 76 90 
           L 100 68 
           L 76 68 Z" 
        fill="url(#odFoldGrad)" 
        filter="url(#odFoldShadow)" />
</svg>
