<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 90" width="100%" height="100%" fill="none">
  <defs>
    <!-- Top Bar Gradient -->
    <linearGradient id="odFullTopGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F16C6C" />
      <stop offset="100%" stop-color="#F59E72" />
    </linearGradient>

    <!-- Bottom Left Gradient -->
    <linearGradient id="odFullBottomLeftGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E85D75" />
      <stop offset="60%" stop-color="#F16C6C" />
      <stop offset="100%" stop-color="#F59E72" />
    </linearGradient>

    <!-- Right Pillar Gradient -->
    <linearGradient id="odFullRightGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F59E72" />
      <stop offset="100%" stop-color="#F16C6C" />
    </linearGradient>

    <!-- Page Fold Gradient -->
    <linearGradient id="odFullFoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFDDD4" />
      <stop offset="50%" stop-color="#FFBBAA" />
      <stop offset="100%" stop-color="#FFA085" />
    </linearGradient>

    <!-- Fold Crease Shadow -->
    <filter id="odFullFoldShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="-1" dy="-1" stdDeviation="1.5" flood-color="#7A2210" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Logo Mark (Scale 0.68 at x=10, y=10) -->
  <g transform="translate(10, 10) scale(0.70)">
    <!-- 1. Top Section -->
    <path d="M 12 10 L 88 10 A 14 14 0 0 1 100 24 L 100 38 L 62 38 L 62 44 L 10 44 L 10 24 A 14 14 0 0 1 24 10 Z" fill="url(#odFullTopGrad)" />

    <!-- 2. Bottom-Left Section -->
    <path d="M 10 50 L 26 50 L 48 72 L 48 90 L 24 90 A 14 14 0 0 1 10 76 Z" fill="url(#odFullBottomLeftGrad)" />

    <!-- 3. Right Vertical Pillar -->
    <path d="M 54 44 L 100 44 L 100 68 L 76 90 L 54 90 Z" fill="url(#odFullRightGrad)" />

    <!-- 4. Folded Corner -->
    <path d="M 76 90 L 100 68 L 76 68 Z" fill="url(#odFullFoldGrad)" filter="url(#odFullFoldShadow)" />
  </g>

  <!-- Wordmark "OuraDesk" -->
  <text x="96" y="47" font-family="'Be Vietnam Pro', sans-serif" font-size="32" font-weight="700" fill="#1F2937" letter-spacing="-0.5">OuraDesk</text>

  <!-- Tagline "Chụp TKB. App lo." -->
  <text x="98" y="70" font-family="'Be Vietnam Pro', sans-serif" font-size="13.5" font-weight="500" fill="#6B7280" letter-spacing="0.1">Chụp TKB. App lo.</text>
</svg>
